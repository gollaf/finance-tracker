name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Adds a "Run workflow" button on the Actions tab, for re-running CI by hand
  # without pushing a commit.
  workflow_dispatch:

# The default rights of the automatic GITHUB_TOKEN for every job in this file:
# read the repository, nothing else. A job that needs more declares its own
# `permissions:` block -- which then *replaces* this one for that job rather
# than adding to it, so it has to repeat `contents: read`.
permissions:
  contents: read

# At most one run per workflow and branch at a time. On a pull request a new
# push makes the older run pointless, so it is cancelled. On master a run that
# has started is never cancelled -- it may be halfway through publishing
# images. Master runs therefore go one after another, so the newest commit's
# images are always the last ones pushed. (While one runs, only the newest
# waiting run is kept; GitHub drops older waiting ones.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Skips the .NET first-run banner and telemetry upload on every fresh runner.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The default is 6 hours. A hung test container start should fail in
    # minutes, not keep a runner busy for the rest of the day.
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the test report step publish its results as a check on the
      # commit or pull request.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restores ~/.nuget/packages from an earlier run, so `dotnet restore`
      # only downloads what changed. The key is a hash of every .csproj: any
      # added, removed or bumped package changes a .csproj, which changes the
      # key. On a miss, restore-keys falls back to the newest cache of any
      # earlier package set -- most packages are still the same -- and a new
      # cache is saved under the new key once the job succeeds.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # One .trx file per test project in TestResults/. No LogFileName on
      # purpose: a fixed file name is reused by every test project, each one
      # overwriting the last, while the default name is unique per project.
      - name: Test
        id: test
        run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults

      # Runs after failing tests too -- that is when the report matters most.
      # Skipped when the Test step never ran (a failed build), since there
      # would be no results to report.
      - name: Test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          list-tests: failed

  # Builds the Api and Worker images exactly as `docker build` does on a
  # laptop. A Dockerfile can break without any test noticing -- a new project
  # the build stage doesn't COPY, a renamed .csproj -- and this job is what
  # catches it. On master the images are also published to GitHub Container
  # Registry (ghcr.io); pull request runs only build them.
  docker-image:
    name: docker-image (${{ matrix.image }})
    # Images are only built from code that passed its tests -- and so only
    # tested code is ever published.
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Pushing to ghcr.io with the automatic GITHUB_TOKEN.
      packages: write
    env:
      # 'true' only for a run on master itself: a push there, or a manual run
      # started on master. A pull request run's ref is refs/pull/<n>/merge,
      # and a manual run on another branch has that branch's ref.
      PUBLISH: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      # Builds both images even when one fails, so a single run shows every
      # broken Dockerfile instead of only the first.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/FinanceTracker.Api/Dockerfile
          - image: worker
            dockerfile: src/FinanceTracker.Worker/Dockerfile
    steps:
      # The build context is this checked-out folder, the same "." as on a
      # laptop, so .dockerignore applies exactly as it does there.
      - uses: actions/checkout@v7

      # A BuildKit builder in its own container. The runner's default builder
      # (the plain "docker" driver) only supports the GitHub Actions cache
      # backend with Docker's containerd image store, which isn't enabled there.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Works out the image's full name and tags, and the OCI labels that
      # describe it. sha-<7 chars> names exactly one commit, forever; latest
      # moves to the newest master build. org.opencontainers.image.source in
      # the labels is what links the package on ghcr.io to this repository.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-tracker-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers are cached in the GitHub Actions cache, under one scope per
      # image: with a shared scope each image's cache would overwrite the
      # other's. mode=max also caches the layers of the build stage -- where
      # the slow `dotnet restore` runs -- not only those of the final image.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
