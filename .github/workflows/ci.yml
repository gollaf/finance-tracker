name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Adds a "Run workflow" button on the Actions tab, for re-running CI by hand
  # without pushing a commit.
  workflow_dispatch:

# The default rights of the automatic GITHUB_TOKEN for every job in this file:
# read the repository, nothing else. A job that needs more declares its own
# `permissions:` block -- which then *replaces* this one for that job rather
# than adding to it, so it has to repeat `contents: read`.
permissions:
  contents: read

# At most one run per workflow and branch at a time. On a pull request a new
# push makes the older run pointless, so it is cancelled. On master a run that
# has started is never cancelled -- it may be halfway through publishing
# images. Master runs therefore go one after another, so the newest commit's
# images are always the last ones pushed. (While one runs, only the newest
# waiting run is kept; GitHub drops older waiting ones.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Skips the .NET first-run banner and telemetry upload on every fresh runner.
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The default is 6 hours. A hung test container start should fail in
    # minutes, not keep a runner busy for the rest of the day.
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the test report step publish its results as a check on the
      # commit or pull request.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restores ~/.nuget/packages from an earlier run, so `dotnet restore`
      # only downloads what changed. The key is a hash of every .csproj: any
      # added, removed or bumped package changes a .csproj, which changes the
      # key. On a miss, restore-keys falls back to the newest cache of any
      # earlier package set -- most packages are still the same -- and a new
      # cache is saved under the new key once the job succeeds.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # One .trx file per test project in TestResults/. No LogFileName on
      # purpose: a fixed file name is reused by every test project, each one
      # overwriting the last, while the default name is unique per project.
      - name: Test
        id: test
        run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults

      # Runs after failing tests too -- that is when the report matters most.
      # Skipped when the Test step never ran (a failed build), since there
      # would be no results to report.
      - name: Test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          list-tests: failed

  # Builds the Api and Worker images exactly as `docker build` does on a
  # laptop. A Dockerfile can break without any test noticing -- a new project
  # the build stage doesn't COPY, a renamed .csproj -- and this job is what
  # catches it. On master the images are also published to GitHub Container
  # Registry (ghcr.io); pull request runs only build them.
  docker-image:
    name: docker-image (${{ matrix.image }})
    # Images are only built from code that passed its tests -- and so only
    # tested code is ever published.
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Pushing to ghcr.io with the automatic GITHUB_TOKEN.
      packages: write
    env:
      # 'true' only for a run on master itself: a push there, or a manual run
      # started on master. A pull request run's ref is refs/pull/<n>/merge,
      # and a manual run on another branch has that branch's ref.
      PUBLISH: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      # Builds both images even when one fails, so a single run shows every
      # broken Dockerfile instead of only the first.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/FinanceTracker.Api/Dockerfile
          - image: worker
            dockerfile: src/FinanceTracker.Worker/Dockerfile
    steps:
      # The build context is this checked-out folder, the same "." as on a
      # laptop, so .dockerignore applies exactly as it does there.
      - uses: actions/checkout@v7

      # A BuildKit builder in its own container. The runner's default builder
      # (the plain "docker" driver) only supports the GitHub Actions cache
      # backend with Docker's containerd image store, which isn't enabled there.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Works out the image's full name and tags, and the OCI labels that
      # describe it. sha-<7 chars> names exactly one commit, forever; latest
      # moves to the newest master build. org.opencontainers.image.source in
      # the labels is what links the package on ghcr.io to this repository.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-tracker-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers are cached in the GitHub Actions cache, under one scope per
      # image: with a shared scope each image's cache would overwrite the
      # other's. mode=max also caches the layers of the build stage -- where
      # the slow `dotnet restore` runs -- not only those of the final image.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Checks that deploy/k8s still renders and that every object it renders is
  # valid Kubernetes YAML -- a misspelled field, a value of the wrong type, an
  # object whose apiVersion this Kubernetes version doesn't have. Nothing is
  # applied anywhere: this job never talks to a cluster.
  k8s-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned versions, each with the SHA-256 of its release archive from the
      # project's published checksums file, so an archive that was swapped or
      # corrupted is refused instead of run.
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The Kubernetes version the manifests are checked against -- the one
      # the local Minikube cluster runs (ADR 0019).
      KUBERNETES_VERSION: 1.37.0
    steps:
      - uses: actions/checkout@v7

      # Both tools are single binaries from their GitHub releases. They go to
      # a folder outside the checkout; GITHUB_PATH puts that folder on PATH
      # for every later step of this job.
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"

          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check
          tar -xzf kustomize.tar.gz -C bin kustomize

          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz -C bin kubeconform

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # kustomization.yaml builds the Secret from deploy/k8s/secrets.env, which
      # is gitignored and so never exists on a runner -- without it the render
      # fails before validating anything. The committed example has the same
      # keys with placeholder values, which is all a render needs. Real
      # credentials never come near CI.
      - name: Use the example secrets file
        run: cp deploy/k8s/secrets.env.example deploy/k8s/secrets.env

      # The same combined YAML `kubectl apply -k deploy/k8s` would send to the
      # cluster.
      - name: Render the manifests
        run: kustomize build deploy/k8s > "$RUNNER_TEMP/rendered.yaml"

      # Validates every rendered object against the official schema of its
      # kind for KUBERNETES_VERSION. -strict also rejects fields the schema
      # doesn't define: without it, a misspelled field name is silently
      # ignored -- by this check and by Kubernetes itself.
      - name: Validate against the Kubernetes schemas
        run: kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" "$RUNNER_TEMP/rendered.yaml"
