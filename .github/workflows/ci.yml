name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Manual "Run workflow" button.
  workflow_dispatch:

# Read-only by default. A job-level `permissions:` block replaces this one
# rather than adding to it, so it must repeat `contents: read`.
permissions:
  contents: read

# One run per branch at a time. Pull request runs cancel older ones; master
# runs are never cancelled mid-publish, so they queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # For the test report check.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Keyed on every .csproj: a package change makes a new key, and
      # restore-keys falls back to the newest older cache.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # No LogFileName: a fixed name would make each test project overwrite
      # the previous one's .trx file.
      - name: Test
        id: test
        run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults

      # Also after failing tests; skipped only when the tests never ran.
      - name: Test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          list-tests: failed

  # Builds both images on every run, catching Dockerfile breakage the tests
  # can't see. Only master runs push them to ghcr.io (ADR 0022).
  docker-image:
    name: docker-image (${{ matrix.image }})
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # 'true' only for runs on master (a pull request's ref is refs/pull/<n>/merge).
      PUBLISH: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/FinanceTracker.Api/Dockerfile
          - image: worker
            dockerfile: src/FinanceTracker.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # The default "docker" driver can't use the GitHub Actions cache here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # sha-<7 chars> pins one commit; latest follows master. The
      # org.opencontainers.image.source label links the package to this repo.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-tracker-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One cache scope per image, or they overwrite each other. mode=max
      # also caches the build stage, where `dotnet restore` runs.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Renders deploy/k8s and validates every object against the Kubernetes
  # schemas. No cluster involved.
  k8s-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned, with the SHA-256 of each release archive.
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The version the local Minikube cluster runs.
      KUBERNETES_VERSION: 1.37.0
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"

          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check
          tar -xzf kustomize.tar.gz -C bin kustomize

          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz -C bin kubeconform

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The real secrets.env is gitignored, and the render fails without one.
      # Placeholder values are enough to render.
      - name: Use the example secrets file
        run: cp deploy/k8s/secrets.env.example deploy/k8s/secrets.env

      - name: Render the manifests
        run: kustomize build deploy/k8s > "$RUNNER_TEMP/rendered.yaml"

      # -strict rejects unknown fields; otherwise a misspelled field is
      # silently ignored, here and by Kubernetes.
      - name: Validate against the Kubernetes schemas
        run: kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" "$RUNNER_TEMP/rendered.yaml"
