services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: financetracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # `api` waits for this: the app has no connection retry of its own.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # -management adds the browser UI at http://localhost:15672.
    image: rabbitmq:4-management
    # RabbitMQ's data directory is named after the hostname; without a fixed
    # one, a recreated container ignores the data in the volume.
    hostname: rabbitmq
    environment:
      # Not the "guest" user, which RabbitMQ normally limits to localhost.
      # Plaintext is fine: local development only (ADR 0008).
      RABBITMQ_DEFAULT_USER: financetracker
      RABBITMQ_DEFAULT_PASS: financetracker
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # check_port_connectivity, not ping: ping can succeed before the AMQP
    # listener is open.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FinanceTracker.Api/Dockerfile
    environment:
      # Development enables Scalar at /scalar/v1. This file is for local use only.
      ASPNETCORE_ENVIRONMENT: Development
      # "postgres" is the service name, resolved by compose's network DNS.
      ConnectionStrings__FinanceTracker: "Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=postgres"
      # A real secret, so never hardcoded: read from the shell or a
      # gitignored .env file (GROQ_API_KEY=gsk_...). Optional.
      Groq__ApiKey: ${GROQ_API_KEY:-}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/FinanceTracker.Worker/Dockerfile
    environment:
      # A non-web host reads DOTNET_ENVIRONMENT, not ASPNETCORE_ENVIRONMENT.
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FinanceTracker: "Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=postgres"
      # Must match RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS above.
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: financetracker
      RabbitMq__Password: financetracker
      # For AI categorization. Unset, transactions stay uncategorized.
      Groq__ApiKey: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
