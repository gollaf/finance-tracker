# Entry point for `kubectl apply -k deploy/k8s`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finance-tracker

resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml

# Hash-suffixed like the Secret below, so editing the file rolls the Pod.
configMapGenerator:
  - name: rabbitmq-config
    files:
      - 30-memory.conf=rabbitmq-memory.conf

# Built from the gitignored secrets.env (see secrets.env.example). The name
# gets a content hash, so changing a value rolls the Pods that use it.
secretGenerator:
  - name: finance-tracker-secrets
    envs:
      - secrets.env
