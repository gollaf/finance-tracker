# Runs the Api image with `migrate` to apply EF Core migrations once, then
# stops (ADR 0017). The Job deletes itself 5 minutes after finishing, so the
# next `kubectl apply -k` creates a fresh one.
#
# Within those 5 minutes, an apply that changes this Job is refused as
# "field is immutable". Delete it and apply again:
#
#   kubectl delete job migrate -n finance-tracker
#   kubectl apply -k deploy/k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app: migrate
spec:
  # Early attempts may fail while Postgres is still starting.
  backoffLimit: 5
  # Long enough to read `kubectl logs job/migrate`.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Keeps each failed attempt's Pod, and its logs.
      restartPolicy: Never
      containers:
        - name: migrate
          image: finance-tracker-api:dev
          # The :dev image is loaded into Minikube, never pulled from a registry.
          imagePullPolicy: IfNotPresent
          # Runs `dotnet FinanceTracker.Api.dll migrate`.
          args: ["migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: POSTGRES_PASSWORD
            # Kubernetes expands $(POSTGRES_PASSWORD), defined above.
            - name: ConnectionStrings__FinanceTracker
              value: Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=$(POSTGRES_PASSWORD)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
