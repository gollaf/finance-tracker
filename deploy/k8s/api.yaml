# The Api: two identical Pods behind one Service. See
# docs/adr/0020-application-images-and-rollout-in-the-local-cluster.md.

# Load-balances across the ready Api Pods. From your laptop:
#   kubectl port-forward svc/api 5001:8080 -n finance-tracker
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  # Replace one Pod at a time, removing an old one only once the new one is
  # ready, so two Pods can always answer.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: finance-tracker-api:dev
          # See migrate-job.yaml: the image only exists inside Minikube.
          imagePullPolicy: IfNotPresent
          ports:
            # Kestrel's default port in the aspnet image.
            - name: http
              containerPort: 8080
          env:
            # Local cluster only: enables Scalar and exception details.
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            # The migrate Job migrates (ADR 0017); /health/ready fails until it's done.
            - name: Database__ApplyMigrationsOnStartup
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__FinanceTracker
              value: Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=$(POSTGRES_PASSWORD)
            # Optional: without it the variable is unset and the AI features
            # fall back, instead of the container failing to start.
            - name: Groq__ApiKey
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: GROQ_API_KEY
                  optional: true
          # Probes use the endpoints from ADR 0009. Startup allows up to 60s.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never fails because of the database.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: database reachable and fully migrated.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # SIGTERM and removal from the Service's endpoints happen at once;
          # waiting 5s lets the endpoint change spread before shutdown starts.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
