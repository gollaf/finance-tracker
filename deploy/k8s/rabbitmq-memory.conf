# Extra RabbitMQ configuration for the local cluster, added next to the
# official image's own files in /etc/rabbitmq/conf.d/ (see rabbitmq.yaml).
#
# RabbitMQ blocks publishers once it uses more memory than its "high
# watermark", instead of growing until the container is killed. By default
# that watermark is 60% of the memory it detects -- but inside a container it
# can't always detect the container's own limit, and may size itself against
# the whole machine instead. RabbitMQ's documentation recommends an absolute
# value on Kubernetes. 600Mi is about 60% of the 1Gi limit in rabbitmq.yaml;
# the headroom matters because the watermark is where throttling starts, not
# a hard cap.
vm_memory_high_watermark.absolute = 600Mi
