# RabbitMQ for the local cluster: one node, data on a PersistentVolumeClaim.
# Same shape as postgres.yaml.

# Headless Service: Host=rabbitmq for clients, as in docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  # More Pods wouldn't form a cluster without peer discovery. Quorum queues
  # work fine on one node.
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            # Only applied on the first start, with an empty data directory.
            - name: RABBITMQ_DEFAULT_USER
              value: financetracker
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            # No hostname pin needed (unlike compose): a StatefulSet Pod's
            # hostname, rabbitmq-0, is stable.
            - name: data
              mountPath: /var/lib/rabbitmq
            # subPath mounts one file without hiding the image's own conf.d files.
            - name: config
              mountPath: /etc/rabbitmq/conf.d/30-memory.conf
              subPath: 30-memory.conf
              readOnly: true
          # TCP probes, not rabbitmq-diagnostics: that starts an Erlang CLI
          # process every time. Startup allows up to 150s for the first boot.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            failureThreshold: 3
          # Lenient: a restart drops every client connection.
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            failureThreshold: 6
          # RabbitMQ throttles at 600Mi (rabbitmq-memory.conf), well below this limit.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
