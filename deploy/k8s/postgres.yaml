# PostgreSQL for the local cluster: one instance, data on a
# PersistentVolumeClaim. See docs/adr/0019-local-kubernetes-cluster-and-manifests.md.

# Headless Service: the StatefulSet's serviceName, and Host=postgres for
# clients -- the same name as in docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  # More replicas would be separate databases, not a cluster.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: financetracker
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory: initdb refuses a non-empty directory, and many
            # volume types have a lost+found folder at their root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "financetracker", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # Lenient on purpose: restart only after a minute without answers.
          # initialDelaySeconds covers initdb on the first start.
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # No CPU limit on purpose: throttling a database just makes it slow.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  # The claim (data-postgres-0) outlives the Pod and the StatefulSet; deleting
  # the claim, the namespace or the cluster wipes the database.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
