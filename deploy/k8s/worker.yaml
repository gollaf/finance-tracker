# The Worker, as two Deployments of the same image in the two roles from
# docs/adr/0018-worker-roles.md:
#   - outbox-relay: publishes outbox rows to RabbitMQ. Exactly one, always.
#   - worker:       consumes messages from the queues. Scale freely.
# Neither has an HTTP port or health probes -- see
# docs/adr/0021-worker-probes-and-shutdown-in-kubernetes.md.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  labels:
    app: outbox-relay
spec:
  # Exactly one: two relays would publish every row twice. Don't scale.
  replicas: 1
  # Recreate, not RollingUpdate, so two relays never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
    spec:
      # Longer than the .NET host's 30s shutdown timeout.
      terminationGracePeriodSeconds: 45
      containers:
        - name: outbox-relay
          image: finance-tracker-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            # Relay only.
            - name: Worker__RunConsumers
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__FinanceTracker
              value: Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=$(POSTGRES_PASSWORD)
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__UserName
              value: financetracker
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: RABBITMQ_PASSWORD
            # No Groq key: the relay only publishes; it never calls the AI.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  # Scale with `kubectl scale deployment worker --replicas=N`; workers share
  # the queues' messages.
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Lets in-flight messages be nacked back to their queue on shutdown.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: finance-tracker-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            # Consumers only.
            - name: Worker__RunOutboxRelay
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__FinanceTracker
              value: Host=postgres;Port=5432;Database=financetracker;Username=postgres;Password=$(POSTGRES_PASSWORD)
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__UserName
              value: financetracker
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: RABBITMQ_PASSWORD
            # Optional: without it, transactions stay uncategorized.
            - name: Groq__ApiKey
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: GROQ_API_KEY
                  optional: true
          # A CSV import's memory use grows with the file.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
